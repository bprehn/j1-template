backend:
  name: github
  repo: jekyll-one-org/j1-template
  branch: decap-cms

# Enables a local proxy backend for development with `npx decap-server`.
local_backend: true

site_url: http://localhost:40000
logo_url: /assets/image/icon/mk/mk-512x512.png

media_folder: packages/400_theme_site/assets/uploads
public_folder: /assets/uploads

publish_mode: editorial_workflow
search: true

collections:
  - name: branding_assets
    label: MK Branding Assets
    label_singular: MK Branding Asset
    delete: false
    files:
      - name: mk_brand_profile
        label: MK Brand Profile
        file: packages/400_theme_site/_data/branding/mk_brand.yml
        fields:
          - { label: Site Name, name: site_name, widget: string }
          - { label: Short Name, name: short_name, widget: string }
          - { label: Brand Tagline, name: brand_tagline, widget: string, required: false }
          - { label: Brand Description, name: brand_description, widget: text, required: false }
          - { label: Primary Logo, name: logo_primary, widget: image, required: false, media_library: { config: { multiple: false } }, hint: "Recommended upload path: assets/uploads/branding" }
          - { label: Site Background Image, name: site_background_image, widget: image, required: false, media_library: { config: { multiple: false } }, hint: "Recommended upload path: assets/uploads/branding" }
          - { label: Background on Homepage Only, name: wrapper_background_home_only, widget: boolean, required: false, default: false, hint: "Enable to apply wrapper background only on pages with layout: home" }
          - { label: Keep Fixed Background on Mobile, name: wrapper_background_fixed_mobile, widget: boolean, required: false, default: false, hint: "Leave off for better mobile performance" }
          - { label: Logo Mark (SVG), name: logo_mark, widget: string, required: false, hint: "Path to mark logo, e.g. /assets/image/icon/mk/mk-logo-mark.svg" }
          - { label: Wordmark (SVG), name: logo_wordmark, widget: string, required: false, hint: "Path to wordmark logo, e.g. /assets/image/icon/mk/mk-wordmark.svg" }
          - { label: Favicon Path, name: favicon, widget: string, required: false }
          - { label: Social Square Image, name: social_square, widget: image, required: false, media_library: { config: { multiple: false } }, hint: "Recommended upload path: assets/uploads/branding" }
          - { label: Social Circle Image, name: social_circle, widget: image, required: false, media_library: { config: { multiple: false } }, hint: "Recommended upload path: assets/uploads/branding" }
          - { label: Contact Email, name: contact_email, widget: string, required: false }
          - { label: Website URL, name: website_url, widget: string, required: false }

  - name: mk_themes
    label: MK Themes
    label_singular: MK Theme
    delete: false
    files:
      - name: mk_themes_profile
        label: MK Themes Profile
        file: packages/400_theme_site/_data/branding/mk_themes.yml
        fields:
          - label: MK Light Theme
            name: mk_light
            widget: object
            fields:
              - { label: Theme Name, name: name, widget: string }
              - { label: CSS Path, name: css, widget: string, hint: "Use /assets/theme/j1/core/css/themes/unolight/bootstrap.css" }
              - { label: Primary Color, name: primary_color, widget: string, required: false, hint: "Hex color for MK Light, e.g. #1CA6D9" }
              - { label: Secondary Color, name: secondary_color, widget: string, required: false, hint: "Hex color for MK Light, e.g. #00487F" }
          - label: MK Dark Theme
            name: mk_dark
            widget: object
            fields:
              - { label: Theme Name, name: name, widget: string }
              - { label: CSS Path, name: css, widget: string, hint: "Use /assets/theme/j1/core/css/themes/unodark/bootstrap.css" }
              - { label: Primary Color, name: primary_color, widget: string, required: false, hint: "Hex color for MK Dark, e.g. #0B1F2A" }
              - { label: Secondary Color, name: secondary_color, widget: string, required: false, hint: "Hex color for MK Dark, e.g. #1CA6D9" }

  - name: homepage_visibility
    label: Homepage Visibility
    label_singular: Homepage Visibility
    delete: false
    files:
      - name: home_lane_visibility
        label: Home Lane Visibility
        file: packages/400_theme_site/_data/layouts/home_visibility.yml
        fields:
          - { label: Header (Attic), name: header, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Custom Header, name: custom_header, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Teaser Banner, name: banner_home_teaser, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Divider Banner, name: banner_divider_1, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Image Banner, name: banner_home_image, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Intro Panel, name: panel_home_intro, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Parallax Banner, name: banner_home_parallax, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Service Panel, name: panel_home_service, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Plan Panel, name: panel_home_plan, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: News Panel, name: panel_home_news, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Google Adsense (Template), name: google_adsense_template, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Google Adsense (Slot), name: google_adsense_slot, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Custom Content (Static Accordion), name: custom_content_static_accordion, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Custom Content (Template Accordion), name: custom_content_template_accordion, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Custom Content (People Panel), name: custom_content_people_panel, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }
          - { label: Custom Content (Collection Panel), name: custom_content_collection_panel, widget: select, options: [{ label: Enable, value: 'true' }, { label: Disable, value: 'false' }], required: true }

  - name: homepage_slider
    label: Homepage Slider
    label_singular: Homepage Slider
    delete: false
    files:
      - name: home_slider_profile
        label: Home Slider Profile
        file: packages/400_theme_site/index.html
        extension: html
        format: yaml-frontmatter
        fields:
          - { label: Layout, name: layout, widget: hidden, default: home }
          - { label: Compress, name: compress, widget: hidden, default: true }
          - { label: Title, name: title, widget: string }
          - { label: Title Extension, name: title_extention, widget: string, required: false }
          - { label: Tagline, name: tagline, widget: string, required: false }
          - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", required: false }
          - { label: Last Modified, name: last_modified, widget: datetime, format: "YYYY-MM-DD HH:mm:ss", required: false }
          - { label: Description, name: description, widget: text, required: false }
          - { label: Keywords, name: keywords, widget: text, required: false }
          - { label: Categories, name: categories, widget: list, required: false }
          - { label: Tags, name: tags, widget: list, required: false }
          - label: Robots
            name: robots
            widget: object
            required: false
            fields:
              - { label: Index, name: index, widget: boolean, required: false, default: true }
              - { label: Follow, name: follow, widget: boolean, required: false, default: true }
          - label: Image Meta
            name: image
            widget: object
            required: false
            fields:
              - { label: Path, name: path, widget: image, required: false, media_library: { config: { multiple: false } }, hint: "Recommended upload path: assets/uploads/home-slider" }
              - { label: Width, name: width, widget: number, value_type: int, required: false }
              - { label: Height, name: height, widget: number, value_type: int, required: false }
          - { label: TTS, name: tts, widget: boolean, required: false, default: true }
          - { label: TOC, name: toc, widget: boolean, required: false, default: false }
          - { label: FAB Menu ID, name: fab_menu_id, widget: string, required: false }
          - { label: Scrollbar, name: scrollbar, widget: boolean, required: false, default: false }
          - { label: Comments, name: comments, widget: boolean, required: false, default: false }
          - { label: Canonical, name: canonical, widget: boolean, required: false, default: false }
          - { label: Personalization, name: personalization, widget: boolean, required: false, default: false }
          - { label: Exclude From Search, name: exclude_from_search, widget: boolean, required: false, default: false }
          - { label: Regenerate, name: regenerate, widget: boolean, required: false, default: false }
          - label: Resources
            name: resources
            widget: list
            required: false
            default: [scroller]
            field: { label: Resource, name: resource, widget: string }
          - label: Resource Options
            name: resource_options
            widget: list
            required: true
            min: 1
            max: 1
            hint: "Configure attic slides for the homepage header slider."
            default:
              - attic:
                  slides:
                    - url: /assets/image/module/attic/1920x1280/j1-launch.jpg
                      alt: Homepage hero image
                      title: Mount Kato
                      tagline: Welcome to the mountain
            fields:
              - label: Attic
                name: attic
                widget: object
                fields:
                  - label: Slides
                    name: slides
                    widget: list
                    summary: "{{fields.title}}"
                    hint: "Add slide image, title, tagline, and optional photo credit/link."
                    default:
                      - url: /assets/image/module/attic/1920x1280/j1-launch.jpg
                        alt: Homepage hero image
                        title: Mount Kato
                        tagline: Welcome to the mountain
                    fields:
                      - { label: Image, name: url, widget: image, required: true, media_library: { config: { multiple: false } }, hint: "Recommended upload path: assets/uploads/home-slider" }
                      - { label: Image Alt, name: alt, widget: string, required: false }
                      - { label: Title, name: title, widget: string, required: false }
                      - { label: Tagline, name: tagline, widget: string, required: false }
                      - label: Photo Credit
                        name: badge
                        widget: object
                        required: false
                        collapsed: true
                        hint: "Used for photographer credit badge; add author and external link."
                        fields:
                          - { label: Type, name: type, widget: select, required: false, options: [{ label: Unsplash, value: unsplash }], default: unsplash }
                          - { label: Photographer Name, name: author, widget: string, required: false }
                          - label: Photographer Link
                            name: href
                            widget: string
                            required: false
                            hint: "External URL to photographer profile (must start with http:// or https://)"
                            pattern:
                              - '^https?://.+'
                              - "Use a full URL starting with http:// or https://"
                      - label: Caption
                        name: caption
                        widget: object
                        required: false
                        collapsed: true
                        hint: "Optional text caption with optional link."
                        fields:
                          - { label: Caption Text, name: text, widget: string, required: false }
                          - label: Caption Link
                            name: href
                            widget: string
                            required: false
                            hint: "Optional external or internal link; external links must start with http:// or https://"
                            pattern:
                              - '^(https?://.+|/.+)?$'
                              - "Use either an absolute URL (http/https) or a site-relative path starting with /"
          - { label: Body, name: body, widget: text, required: false }

  - name: about_pages
    label: MK Site Pages
    label_singular: MK Site Page
    folder: packages/400_theme_site/pages/public/about
    create: true
    extension: adoc
    format: yaml-frontmatter
    slug: "{{slug}}"
    preview_path: "pages/public/about/{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Tagline, name: tagline, widget: string, required: false }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Keywords, name: keywords, widget: text, required: false }
      - { label: Categories, name: categories, widget: list, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - label: Permalink
        name: permalink
        widget: string
        hint: "Use the site path style, e.g. /pages/public/about/my-page/"
      - { label: Comments Enabled, name: comments, widget: boolean, required: false, default: false }
      - { label: Regenerate, name: regenerate, widget: boolean, required: false, default: false }
      - { label: Body, name: body, widget: text }

  - name: portfolio_entries
    label: MK Portfolio
    label_singular: MK Portfolio Entry
    folder: packages/400_theme_site/collections/_portfolio
    create: true
    extension: adoc
    format: yaml-frontmatter
    slug: "{{slug}}"
    preview_path: "collections/public/portfolio/{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: text }

  - name: people_entries
    label: MK Team
    label_singular: MK Team Member
    folder: packages/400_theme_site/collections/_people
    create: true
    extension: adoc
    format: yaml-frontmatter
    slug: "{{slug}}"
    preview_path: "collections/public/people/{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Body, name: body, widget: text }

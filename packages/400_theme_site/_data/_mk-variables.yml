mk-basic-desc:                          19 Trails | 8 Chairlifts | 2 Terrain Parks
                                        2 Conveyor Lifts (beginner area & tubing park)
                                        Lower Food Court | The Lift Bar & Grill
                                        Certified Ski/Snowboard School | 100% Snow Making
                                        Full Service Rental Shop | Tuning Center & Accessory Shop
                                        Summer Mountain Biking

mk-desc-loc:                            Just a mile south of Mankato, Minnesota. 
                                        Nestled in the valleys created by the 
                                        confluence of the Le Sueur, Blue Earth, 
                                        and Minnesota rivers, making great terrain 
                                        for… skiing, snowboarding, tubing, & 
                                        mountain biking. 
mk-desc-loc-short:                      Located just one mile south of Mankato in the scenic Minnesota River Valley.
